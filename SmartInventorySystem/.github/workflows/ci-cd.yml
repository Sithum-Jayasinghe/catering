name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'
  SOLUTION_PATH: 'SmartInventorySystem/backend/SmartInventorySystem.sln'
  UNIT_TEST_PROJECT: 'SmartInventorySystem/backend/tests/SriLankanCatering.Inventory.UnitTests/SriLankanCatering.Inventory.UnitTests.csproj'

jobs:
  # ──────────────────────────────────────────────────────────────────────────
  backend-build-and-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET ${{ env.DOTNET_VERSION }}
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build solution (Release)
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Run unit tests
        run: >
          dotnet test ${{ env.UNIT_TEST_PROJECT }}
          -c Release
          --no-build
          --verbosity normal
          --logger "trx;LogFileName=unit-test-results.trx"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/*.trx'
          retention-days: 30

  # ──────────────────────────────────────────────────────────────────────────
  webapp-build-and-test:
    name: Web App Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'SmartInventorySystem/web-app/package-lock.json'

      - name: Install dependencies
        working-directory: SmartInventorySystem/web-app
        run: npm ci

      - name: Run lint
        working-directory: SmartInventorySystem/web-app
        run: npm run lint

      - name: Run tests
        working-directory: SmartInventorySystem/web-app
        run: npm run test

      - name: Build
        working-directory: SmartInventorySystem/web-app
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: webapp-build
          path: 'SmartInventorySystem/web-app/dist/**'
          retention-days: 7

  # ──────────────────────────────────────────────────────────────────────────
  ai-services-build-and-test:
    name: AI Services Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'SmartInventorySystem/ai-services/package-lock.json'

      - name: Install dependencies
        working-directory: SmartInventorySystem/ai-services
        run: npm ci

      - name: Build TypeScript
        working-directory: SmartInventorySystem/ai-services
        run: npm run build

      - name: Run tests
        working-directory: SmartInventorySystem/ai-services
        run: npm test -- --passWithNoTests

  # ──────────────────────────────────────────────────────────────────────────
  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, webapp-build-and-test, ai-services-build-and-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

  # ──────────────────────────────────────────────────────────────────────────
  build-and-push-docker:
    name: Build & Push Docker Images
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/smartinventory-backend
            ${{ secrets.DOCKER_USERNAME }}/smartinventory-webapp
            ${{ secrets.DOCKER_USERNAME }}/smartinventory-ai
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push Backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smartinventory-backend:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/smartinventory-backend:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartinventory-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartinventory-backend:buildcache,mode=max

      - name: Build and push Web App image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.webapp
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smartinventory-webapp:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/smartinventory-webapp:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartinventory-webapp:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartinventory-webapp:buildcache,mode=max

      - name: Build and push AI Services image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ai-services
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/smartinventory-ai:${{ github.sha }}
            ${{ secrets.DOCKER_USERNAME }}/smartinventory-ai:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartinventory-ai:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartinventory-ai:buildcache,mode=max

  # ──────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to Production
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET for EF migrations
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/smartinventory
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
