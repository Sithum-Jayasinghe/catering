name: CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  DOTNET_VERSION: '10.0.x'
  NODE_VERSION: '20.x'
  SOLUTION_PATH: 'backend/src/SriLankanCatering.Inventory.API/SriLankanCatering.Inventory.API.csproj'
  TEST_PROJECT: 'backend/tests/SriLankanCatering.Inventory.Tests/SriLankanCatering.Inventory.Tests.csproj'

jobs:
  backend-build-and-test:
    name: Backend Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore dependencies
        run: dotnet restore ${{ env.SOLUTION_PATH }}

      - name: Build
        run: dotnet build ${{ env.SOLUTION_PATH }} -c Release --no-restore

      - name: Run xUnit tests
        run: dotnet test ${{ env.TEST_PROJECT }} -c Release --no-build --verbosity normal --logger "trx;LogFileName=test-results.trx"

      - name: Publish test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-results
          path: '**/*.trx'
          retention-days: 30

  webapp-build-and-test:
    name: Web App Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: 'webapp/package-lock.json'

      - name: Install dependencies
        working-directory: ./webapp
        run: npm ci

      - name: Run lint
        working-directory: ./webapp
        run: npm run lint

      - name: Run tests
        working-directory: ./webapp
        run: npm run test -- --run

      - name: Build
        working-directory: ./webapp
        run: npm run build

      - name: Publish build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: webapp-build
          path: 'webapp/dist/**'
          retention-days: 7

  ai-services-build-and-test:
    name: AI Services Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: 'ai-services/requirements.txt'

      - name: Install dependencies
        working-directory: ./ai-services
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install flake8 pytest

      - name: Run lint
        working-directory: ./ai-services
        run: flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

      - name: Run tests
        working-directory: ./ai-services
        run: |
          if [ -d "tests" ]; then python -m pytest tests/ -v; fi

  security-scan:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [backend-build-and-test, webapp-build-and-test, ai-services-build-and-test]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          scan-ref: '.'
          format: 'sarif'
          output: 'trivy-results.sarif'

      - name: Upload Trivy results
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: 'trivy-results.sarif'

  build-and-push-docker:
    name: Build & Push Docker Images
    needs: security-scan
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: |
            ${{ secrets.DOCKER_USERNAME }}/smartinventory-backend
            ${{ secrets.DOCKER_USERNAME }}/smartinventory-webapp
            ${{ secrets.DOCKER_USERNAME }}/smartinventory-ai
          tags: |
            type=sha,prefix={{branch}}-
            type=ref,event=tag
            type=semver,pattern={{version}}

      - name: Build and push Backend
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.backend
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smartinventory-backend:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/smartinventory-backend:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartinventory-backend:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartinventory-backend:buildcache,mode=max

      - name: Build and push Web App
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.webapp
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smartinventory-webapp:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/smartinventory-webapp:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartinventory-webapp:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartinventory-webapp:buildcache,mode=max

      - name: Build and push AI Services
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.ai-services
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/smartinventory-ai:${{ github.sha }},${{ secrets.DOCKER_USERNAME }}/smartinventory-ai:latest
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartinventory-ai:buildcache
          cache-to: type=registry,ref=${{ secrets.DOCKER_USERNAME }}/smartinventory-ai:buildcache,mode=max

  deploy:
    name: Deploy to Production
    needs: build-and-push-docker
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET for EF migrations
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Download backend build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-build
          path: ./backend-publish

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: ${{ secrets.SERVER_PORT }}
          script: |
            cd /opt/smartinventory

            # Create backup before deploy
            powershell -File scripts/backup.ps1

            # Pull latest images
            docker-compose pull

            # Run migrations
            docker-compose run --rm backend dotnet ef database update

            # Deploy with zero-downtime
            docker-compose up -d --force-recreate --remove-orphans

            # Wait for health checks
            echo "Waiting for services..."
            sleep 30

            # Verify deployment
            docker-compose ps
            docker-compose logs --tail=50

            # Cleanup
            docker system prune -f
