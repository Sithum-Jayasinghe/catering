services:
  redis:
    image: redis:7-alpine
    container_name: smartinventory-redis
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - smartinventory-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  ai-services:
    build:
      context: .
      dockerfile: Dockerfile.ai-services
    container_name: smartinventory-ai
    environment:
      - REDIS_URL=redis://redis:6379
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LANGCHAIN_API_KEY=${LANGCHAIN_API_KEY}
    ports:
      - "8001:8001"
    networks:
      - smartinventory-network
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: smartinventory-backend
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ASPNETCORE_URLS=http://+:8080
      - ConnectionStrings__Default=${DATABASE_URL}
      - Redis__ConnectionString=redis://redis:6379
      - AiService__BaseUrl=http://ai-services:8001
      - Jwt__SecretKey=${JWT__SECRET}
      - Jwt__Issuer=${JWT__ISSUER}
      - Jwt__Audience=${JWT__AUDIENCE}
      - ALLOWED_ORIGINS=http://localhost:3000
    ports:
      - "8080:8080"
    networks:
      - smartinventory-network
    depends_on:
      redis:
        condition: service_healthy
      ai-services:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  webapp:
    build:
      context: .
      dockerfile: Dockerfile.webapp
    container_name: smartinventory-webapp
    environment:
      - VITE_API_URL=http://localhost:8080/api
    ports:
      - "3000:80"
    networks:
      - smartinventory-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  smartinventory-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
